<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Pro</title>

<style>
body{background:#0e1117;color:#e8eaf0;font-family:sans-serif;padding:15px}
.card{background:#161b27;padding:12px;border-radius:10px;margin-bottom:10px}
button{padding:8px 12px;margin:5px;border:none;border-radius:6px;cursor:pointer}
input,select{padding:8px;margin:5px;background:#1e2535;border:1px solid #2a3347;color:#fff}
</style>
</head>

<body>

<h2>Pickleball PRO</h2>

<div class="card">
<input id="name" placeholder="Имя">
<select id="level">
<option value="1">Начинающий</option>
<option value="2">Средний</option>
<option value="3">Топ</option>
</select>
<button onclick="addPlayer()">Добавить</button>
</div>

<div class="card">
<button onclick="generate()">⚡ Сгенерировать</button>
<button onclick="saveSession()">💾 Сохранить</button>
<button onclick="share()">🔗 Поделиться</button>
</div>

<div class="card" id="players"></div>
<div id="rounds"></div>

<script>

// ================= STATE =================
let players = [];
let rounds = [];
let history = {
  lastPlayers: [],
  lastWaiters: [],
  pairCount: {},
  playCount: {}
};

// ================= HELPERS =================
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function allPairs(p){
  return [
    {t1:[p[0],p[1]],t2:[p[2],p[3]]},
    {t1:[p[0],p[2]],t2:[p[1],p[3]]},
    {t1:[p[0],p[3]],t2:[p[1],p[2]]}
  ];
}

function key(a,b){
  return [a.name,b.name].sort().join('|');
}

// ================= PLAYERS =================
function addPlayer(){
  let n=name.value.trim();
  let l=parseInt(level.value);
  if(!n) return;

  players.push({name:n,level:l});
  name.value='';
  renderPlayers();
}

function renderPlayers(){
  playersDiv = document.getElementById('players');
  playersDiv.innerHTML = players.map(p=>`${p.name} (${p.level})`).join('<br>');
}

// ================= CORE =================

function evaluate(c){
  let score=0;
  let current=[];

  c.courts.forEach(ct=>{
    current=current.concat(ct.t1,ct.t2);
  });

  current.forEach(p=>{
    if(history.lastPlayers.includes(p.name)) score+=10;
  });

  c.waiting.forEach(p=>{
    if(history.lastWaiters.includes(p.name)) score+=25;
  });

  c.courts.forEach(ct=>{
    let k1=key(ct.t1[0],ct.t1[1]);
    let k2=key(ct.t2[0],ct.t2[1]);

    score+=(history.pairCount[k1]||0)*20;
    score+=(history.pairCount[k2]||0)*20;

    let s1=ct.t1[0].level+ct.t1[1].level;
    let s2=ct.t2[0].level+ct.t2[1].level;

    score+=Math.abs(s1-s2)*8;
  });

  return score;
}

function apply(c){

  history.lastPlayers=[];
  history.lastWaiters=c.waiting.map(p=>p.name);

  c.courts.forEach(ct=>{
    let all=ct.t1.concat(ct.t2);

    all.forEach(p=>{
      history.lastPlayers.push(p.name);
      history.playCount[p.name]=(history.playCount[p.name]||0)+1;
    });

    let k1=key(ct.t1[0],ct.t1[1]);
    let k2=key(ct.t2[0],ct.t2[1]);

    history.pairCount[k1]=(history.pairCount[k1]||0)+1;
    history.pairCount[k2]=(history.pairCount[k2]||0)+1;
  });
}

// ================= GENERATE =================

function generate(){

  if(players.length<4){
    alert("Минимум 4 игрока");
    return;
  }

  history={
    lastPlayers:[],
    lastWaiters:[],
    pairCount:{},
    playCount:{}
  };

  rounds=[];

  let courts = players.length>=8 ? 2 : 1;
  let perRound = courts*4;

  for(let r=0;r<15;r++){

    let best=null;
    let bestScore=999999;

    for(let i=0;i<60;i++){

      let arr=[...players];
      shuffle(arr);

      let playing=arr.slice(0,perRound);
      let waiting=arr.slice(perRound);

      let cts=[];

      for(let c=0;c<courts;c++){
        let p4=playing.slice(c*4,c*4+4);
        let pair=allPairs(p4)[Math.floor(Math.random()*3)];

        cts.push(pair);
      }

      let cand={courts:cts,waiting};

      let s=evaluate(cand);

      if(s<bestScore){
        bestScore=s;
        best=cand;
      }
    }

    apply(best);
    rounds.push(best);
  }

  renderRounds();
}

// ================= RENDER =================

function renderRounds(){
  let html='';

  rounds.forEach((r,i)=>{
    html+=`<div class="card"><b>Раунд ${i+1}</b><br>`;

    r.courts.forEach((c,ci)=>{
      html+=`Корт ${ci+1}: ${c.t1[0].name}+${c.t1[1].name} vs ${c.t2[0].name}+${c.t2[1].name}<br>`;
    });

    if(r.waiting.length){
      html+=`⏳ ${r.waiting.map(p=>p.name).join(', ')}`;
    }

    html+='</div>';
  });

  document.getElementById('rounds').innerHTML=html;
}

// ================= SAVE =================
function saveSession(){
  localStorage.setItem("pb",JSON.stringify({players,rounds}));
  alert("Сохранено");
}

// ================= SHARE =================
function share(){
  let data=btoa(JSON.stringify(rounds));
  let url=location.origin+location.pathname+"?d="+data;
  navigator.clipboard.writeText(url);
  alert("Ссылка скопирована");
}

// ================= LOAD SHARE =================
(function(){
  let p=new URLSearchParams(location.search);
  if(p.get("d")){
    rounds=JSON.parse(atob(p.get("d")));
    renderRounds();
  }
})();

</script>

</body>
</html>
